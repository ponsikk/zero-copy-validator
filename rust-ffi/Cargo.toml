[package]
name = "json-validator-ffi"
version = "0.1.0"
edition = "2021"
authors = ["ponsikk"]
description = "High-performance JSON validation library with FFI bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
simd-json = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"              # For email/URL validation
chrono = "0.4"              # For ISO 8601 date validation
uuid = "1.6"                # For UUID validation
ffi-safety-macro = { path = "ffi-safety-macro" }  # Panic safety for FFI

[profile.release]
opt-level = 3           # Maximum optimization
lto = true              # Link-time optimization
codegen-units = 1       # Better optimization (slower compile)
panic = "unwind"        # ⚠️ CRITICAL: Required for catch_unwind to work!
strip = true            # Remove debug symbols

[dev-dependencies]
criterion = "0.8"       # For benchmarks

[[bench]]
name = "validators_bench"
harness = false
