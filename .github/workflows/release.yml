name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true

env:
  RUST_VERSION: "1.92"
  JAVA_VERSION: "25"

jobs:
  # ============================================
  # Build for all platforms
  # ============================================
  build-native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libjson_validator_ffi.so
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact: libjson_validator_ffi.dylib
            platform: darwin-x86_64
            target: x86_64-apple-darwin
          - os: macos-14
            artifact: libjson_validator_ffi.dylib
            platform: darwin-aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            artifact: json_validator_ffi.dll
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: 🔨 Build release
        working-directory: rust-ffi
        run: cargo build --release

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: rust-ffi/target/release/${{ matrix.artifact }}

  # ============================================
  # Create release JAR
  # ============================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 📥 Download all native libraries
        uses: actions/download-artifact@v4
        with:
          path: native-libs/

      - name: 📁 Organize native libraries
        run: |
          mkdir -p src/main/resources/native/linux-x86_64
          mkdir -p src/main/resources/native/darwin-x86_64
          mkdir -p src/main/resources/native/darwin-aarch64
          mkdir -p src/main/resources/native/windows-x86_64

          cp native-libs/native-linux-x86_64/* src/main/resources/native/linux-x86_64/
          cp native-libs/native-darwin-x86_64/* src/main/resources/native/darwin-x86_64/
          cp native-libs/native-darwin-aarch64/* src/main/resources/native/darwin-aarch64/
          cp native-libs/native-windows-x86_64/* src/main/resources/native/windows-x86_64/

          ls -R src/main/resources/native/

      - name: 📝 Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: 🔨 Build release JAR
        run: mvn clean package -DskipTests

      - name: 📦 Create source archive
        run: |
          git archive --format=tar.gz --prefix=zero-copy-json-${{ steps.version.outputs.VERSION }}/ \
            HEAD > zero-copy-json-${{ steps.version.outputs.VERSION }}-src.tar.gz

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > release-notes.md << 'EOF'
          ## 🚀 Zero-Copy JSON Validator ${{ steps.version.outputs.VERSION }}

          ### 📦 Installation

          **Maven:**
          ```xml
          <dependency>
              <groupId>io.zerocopy</groupId>
              <artifactId>json-validator</artifactId>
              <version>${{ steps.version.outputs.VERSION }}</version>
          </dependency>
          ```

          **Gradle:**
          ```gradle
          implementation 'io.zerocopy:json-validator:${{ steps.version.outputs.VERSION }}'
          ```

          ### ✨ Features

          - 🦀 Native Rust backend with SIMD optimizations
          - ☕ Java 22+ Panama FFI integration
          - 🐧 Linux, 🍎 macOS, 🪟 Windows support
          - 🔥 10-20x faster than Jackson/Gson
          - 🧠 Zero-copy validation
          - 🔒 Thread-safe

          ### 📋 Requirements

          - Java 22 or higher
          - JVM flags: `--enable-preview --enable-native-access=ALL-UNNAMED`

          ### 📚 Documentation

          - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          - [Usage Guide](https://github.com/${{ github.repository }}/blob/main/USAGE.md)
          - [API Docs](https://github.com/${{ github.repository }}/blob/main/docs/)

          ### 🐛 Bug Reports

          Found a bug? [Open an issue](https://github.com/${{ github.repository }}/issues/new)

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/previous...${{ steps.version.outputs.VERSION }}
          EOF

          cat release-notes.md

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Zero-Copy JSON Validator ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            target/json-validator-*.jar
            zero-copy-json-${{ steps.version.outputs.VERSION }}-src.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Release summary
        run: |
          echo "✅ Release created successfully!"
          echo "📦 Version: ${{ steps.version.outputs.VERSION }}"
          echo "🔗 URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }}"

  # ============================================
  # Optional: Publish to Maven Central
  # ============================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: create-release
    if: false  # Enable when ready for Phase 3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: 📦 Publish to Maven Central
        run: mvn deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
