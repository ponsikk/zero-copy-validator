version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/rust-ffi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
